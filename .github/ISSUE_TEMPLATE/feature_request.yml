name: Đề xuất cải tiến
description: Nêu nhu cầu, phạm vi và cách đánh giá kết quả
body:
  - type: markdown
    attributes:
      value: Đọc roadmap và issue hiện có trước. Đề xuất không tự cấp quyền provider/deploy, thay license hay gửi dữ liệu riêng tư.
  - type: textarea
    id: problem
    attributes:
      label: Vấn đề người dùng cần giải quyết
      description: Ai cần gì, trong bối cảnh nào? Dùng ví dụ synthetic, không chat/account thật.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Hành vi mong muốn và phạm vi
      description: Component bị ảnh hưởng, giới hạn và phương án đơn giản nhất bạn thấy phù hợp.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Cách xác nhận đã giải quyết
      description: Acceptance có thể kiểm tra; phân biệt local fixture, runtime/native, thiết bị và provider/cloud.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Trước khi gửi
      options:
        - label: Tôi đã tìm issue/roadmap hiện có và không đưa secrets hoặc dữ liệu người dùng thật vào đề xuất.
          required: true
