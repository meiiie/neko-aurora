services:
  owner-fixture:
    profiles: [owner-test]
    image: neko-aurora-browser:dev
    build: .
    command: [node, tests/owner-ui-fixture.mjs]
    environment:
      AURORA_CLOUD_BROWSER_KEY: ${AURORA_CLOUD_OWNER_FIXTURE_KEY:?Set the private owner-fixture service key}
      DATA_DIR: /data
      PORT: "8080"
    ports:
      - "127.0.0.1:8878:8080"
    volumes:
      - owner-fixture-data:/data
    networks:
      - cloud
    restart: unless-stopped
    stop_grace_period: 45s
    shm_size: 256mb
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
      - seccomp=./seccomp.playwright.json

volumes:
  owner-fixture-data:
