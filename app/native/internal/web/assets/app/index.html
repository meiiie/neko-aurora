<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4efe4">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131018">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Neko Aurora">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/app/favicon.ico" sizes="any"><link rel="icon" href="/app/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/app/icon-180.png">
<title>Neko Aurora</title>
<link rel="stylesheet" href="/app/aurora/fonts.css">
<link rel="stylesheet" href="/app/aurora/aurora.css">
<link rel="stylesheet" href="/app/style.css">
<script src="/app/theme.js"></script>
<script src="/app/aurora/icons.js" defer></script>
<script src="/app/app.js" defer></script>
</head>
<body>
<div id="app">
  <section class="screen" id="list" aria-label="Bot">
    <header class="top">
      <button class="me" id="meBtn" aria-label="Cài đặt"><img src="/app/icon.svg" alt="" width="36" height="36"></button>
      <div class="spacer"></div>
      <button class="round" id="newBtn" aria-label="Tạo mới" aria-haspopup="menu"></button>
    </header>
    <div class="scroll" id="listScroll">
      <h1 class="list-title">Bot</h1>
      <div class="featured" id="featured"></div>
      <article class="brief" id="brief"></article>
      <ul class="rows" id="rows"></ul>
      <p class="empty hidden" id="empty"></p>
    </div>
    <button class="unread-pill hidden" id="unreadPill"></button>
    <div class="dock">
      <button class="round glass" id="appsBtn" aria-label="Kết nối ứng dụng"></button>
      <label class="searchbar glass"><span id="searchIc"></span><input id="search" type="search" placeholder="Tìm bot, nhóm…" autocomplete="off" aria-label="Tìm"></label>
    </div>
  </section>
  <section class="screen thread off" id="thread" aria-label="Hội thoại">
    <header class="top glass-bar">
      <button class="icon-btn" id="backBtn" aria-label="Quay lại"></button>
      <span class="face-slot" id="threadAvatar" aria-hidden="true"></span>
      <div class="title"><b id="threadName"></b><small id="threadState"></small></div>
      <button class="icon-btn" id="activityBtn" aria-label="Xem bot đang làm gì"></button>
    </header>
    <div class="scroll" id="messages"></div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="Nhắn tin…" enterkeyhint="send"></textarea>
      <button type="button" class="mic" id="micBtn" aria-label="Nói để nhập"></button>
      <button class="send" aria-label="Gửi"></button>
    </form>
  </section>
  <div class="scrim hidden" id="scrim"></div>
  <div class="menu glass hidden" id="newMenu" role="menu">
    <button role="menuitem" id="menuBot"><span class="mi" data-i="plus"></span>Bot mới</button>
    <button role="menuitem" id="menuGroup"><span class="mi" data-i="users"></span>Nhóm chat mới</button>
  </div>

  <section class="sheet hidden" id="sheet" role="dialog" aria-label="Bot mới">
    <div class="grip" id="grip"></div>
    <header class="sheet-top"><button class="icon-btn close" id="cancelBtn" aria-label="Đóng"></button><b>Bot mới</b><span class="w44"></span></header>
    <div class="scroll sheet-body" id="sheetBody">
      <div class="stage" id="preview"></div>
      <input class="field" id="agentName" maxlength="28" placeholder="Đặt tên cho bot" aria-label="Tên bot" autocomplete="off">
      <input class="field sub-field" id="agentDesc" maxlength="80" placeholder="Bot này làm gì? (tuỳ chọn)" aria-label="Mô tả">
      <h3 class="label">Hình dạng</h3><div class="shapes" id="shapes"></div>
      <h3 class="label">Màu</h3><div class="colors" id="colors"></div>
    </div>
    <div class="sheet-foot"><button class="cta" id="createBtn" disabled>Tạo bot</button></div>
  </section>

  <section class="sheet hidden" id="groupSheet" role="dialog" aria-label="Nhóm chat mới">
    <div class="grip"></div>
    <header class="sheet-top"><button class="icon-btn close" id="closeGroup" aria-label="Đóng"></button><b>Nhóm chat mới</b><button class="pill" id="groupNext" disabled>Tiếp</button></header>
    <div class="to"><span>Tới:</span><div class="chips" id="groupChips"></div><input id="groupSearch" placeholder="Tìm bot" autocomplete="off" aria-label="Tìm bot"></div>
    <input class="field group-name" id="groupName" maxlength="40" placeholder="Tên nhóm (tuỳ chọn)" aria-label="Tên nhóm">
    <ul class="scroll pick" id="groupList"></ul>
  </section>

  <section class="sheet hidden" id="settings" role="dialog" aria-label="Cài đặt">
    <div class="grip"></div>
    <header class="sheet-top"><button class="icon-btn close" id="closeSettings" aria-label="Đóng"></button><b>Cài đặt</b><span class="w44"></span></header>
    <div class="scroll grouped" id="settingsBody"></div>
  </section>

  <section class="sheet hidden" id="connectors" role="dialog" aria-label="Kết nối">
    <div class="grip"></div>
    <header class="sheet-top"><button class="icon-btn close" id="closeConnectors" aria-label="Đóng"></button><b>Kết nối</b><span class="count" id="connCount"></span></header>
    <label class="searchbar inset"><span class="mi" data-i="search"></span><input id="connSearch" type="search" placeholder="Tìm kết nối" aria-label="Tìm kết nối"></label>
    <div class="cats" id="connCats"></div>
    <ul class="scroll conns" id="connList"></ul>
  </section>

  <aside class="sheet activity hidden" id="activity" aria-label="Hoạt động"><div class="grip"></div><header class="sheet-top"><span class="w44"></span><b>Đang làm gì</b><button class="text-btn" id="closeActivity">Xong</button></header><ol class="scroll" id="log"></ol></aside>
  <aside class="sheet themes hidden" id="themes" aria-label="Giao diện"><div class="grip"></div><header class="sheet-top"><span class="w44"></span><b>Giao diện</b><button class="text-btn" id="closeThemes">Xong</button></header><div class="scroll" id="themeList"></div></aside>
  <section class="login hidden" id="login" aria-label="Đăng nhập chủ sở hữu"><form id="loginForm"><img id="loginMark" class="login-mark" src="/app/icon-192.png" width="72" height="72" alt="" aria-hidden="true"><h1>Neko Aurora</h1><p class="sub">Nhập mã chủ sở hữu để mở.</p><input id="loginCode" type="password" autocomplete="current-password" placeholder="Mã chủ sở hữu" aria-label="Mã chủ sở hữu"><button class="pill wide">Mở</button></form></section>
  <div class="toast" id="toast" role="status"></div>
</div>
</body>
</html>
