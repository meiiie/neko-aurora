<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2f2f4"><title>Đăng nhập · Neko Aurora</title><link rel="icon" href="/app/icon.svg"><link rel="apple-touch-icon" href="/app/icon-180.png"><link rel="stylesheet" href="/app/hosted.css"><script src="/app/i18n.js"></script></head><body><main>
<div class="brand"><img src="/app/icon-180.png" alt=""><h1>Neko Aurora</h1><p class="sub">Đội bot AI làm việc cho bạn, mỗi bot có máy tính riêng</p></div>
<section class="card" id="emailStep" aria-label="Đăng nhập bằng email">
 <label for="email">Email</label><input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" placeholder="ban@example.com" required>
 <button class="btn primary" id="sendBtn">Gửi mã đăng nhập</button>
 <div id="oauth" class="hidden"><div class="or">hoặc</div>
  <a class="btn soft hidden" id="apple" href="/app/auth/apple/start"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.8.9-3.5.9-.7 0-1.8-.8-3-.8-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.4 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.3 0 2.1-1.1 2.8-2.3.9-1.3 1.3-2.6 1.3-2.6s-2.5-1-2.5-3.8zM14.1 5.8c.6-.8 1.1-1.9 1-3-.9 0-2.1.6-2.7 1.4-.6.7-1.1 1.8-1 2.9 1 .1 2.1-.5 2.7-1.3z"/></svg>Tiếp tục với Apple</a>
  <a class="btn soft hidden" id="google" href="/app/auth/google/start" style="margin-top:10px"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z"/><path fill="#34A853" d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22z"/><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14z"/><path fill="#EA4335" d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z"/></svg>Tiếp tục với Google</a>
 </div>
</section>
<section class="card hidden" id="codeStep" aria-label="Nhập mã">
 <p class="sub" id="sentTo"></p>
 <label for="code">Mã 6 số</label><input id="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]*">
 <button class="btn primary" id="verifyBtn">Đăng nhập</button>
 <button class="text-btn" id="backBtn">Đổi email</button>
</section>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<section class="deploy" aria-label="Tự host">
 <p>Muốn máy chủ riêng cho bạn hoặc nhóm?</p>
 <a class="btn rw" id="deployBtn" href="https://railway.com/new/template?template=https%3A%2F%2Fgithub.com%2Fmeiiie%2Fneko-aurora" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2.1 10.7h12.6c-.1-.5-.3-1-.5-1.5H3.3c.3-.6.7-1.1 1.1-1.6h8.3a9.8 9.8 0 0 0-17.5 6.1h0zM12 2a10 10 0 0 0-7.1 3h9.7A10 10 0 0 0 12 2zm-9.8 9.7c0 .5 0 1 .1 1.5h14.9c0-.5-.1-1-.2-1.5H2.2zm.6 3.3c.2.5.4 1 .7 1.5h13.2c.2-.5.4-1 .5-1.5H2.8zM12 22a10 10 0 0 0 7.9-3.9H4.1A10 10 0 0 0 12 22z"/></svg>Deploy on Railway</a>
</section>
<footer><a href="/app/privacy.html">Quyền riêng tư</a> · <a href="/app/terms.html">Điều khoản sử dụng</a></footer>
</main><script src="/app/hosted.js"></script></body></html>
