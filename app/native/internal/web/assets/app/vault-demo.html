<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Trang thử thanh toán (demo Vault)</title><link rel="stylesheet" href="/app/legal.css"><script src="/app/aurora/vendor/i18next.min.js"></script><script src="/app/aurora/locales.js"></script><script src="/app/i18n.js"></script><script src="/app/aurora/locale-page.js"></script><link rel="stylesheet" href="/app/aurora/localization.css"></head><body><main>
<h1>Trang thử thanh toán</h1><p>Trang demo để kiểm tra Vault của Neko Aurora. Không gửi dữ liệu đi đâu, không trừ tiền. Chỉ dùng thẻ thử 4242.</p>
<form id="pay"><p><label>Số thẻ <input name="cardnumber" autocomplete="cc-number" inputmode="numeric"></label></p>
<p><label>Tên trên thẻ <input name="ccname" autocomplete="cc-name"></label></p>
<p><label><span data-i18n="vault.cardExpiry">Ngày hết hạn</span> <input name="exp" autocomplete="cc-exp" placeholder="MM/YY"></label> <label>CVC <input name="cvc" autocomplete="cc-csc"></label></p>
<p><button type="submit">Thanh toán thử 0đ</button></p></form><p id="out" role="status"></p></main>
<script src="/app/vault-demo.js"></script></body></html>
