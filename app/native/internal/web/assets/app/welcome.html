<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chào mừng · Neko Aurora</title><link rel="icon" href="/app/icon.svg"><link rel="stylesheet" href="/app/hosted.css"><script src="/app/i18n.js"></script></head><body><main>
<div class="brand"><img src="/app/icon-180.png" alt=""><h1>Chào mừng tới Neko Aurora</h1><p class="sub">Một chạm, Aurora sẽ lo phần còn lại</p></div>
<section class="card" aria-label="Thiết lập">
 <label for="name">Aurora nên gọi bạn là gì?</label><input id="name" autocomplete="given-name" maxlength="40" placeholder="Tên của bạn">
 <label id="goalLbl">Bạn muốn dùng cho việc gì?</label>
 <div class="goals" role="group" aria-labelledby="goalLbl">
  <button class="goal" data-goal="work" aria-pressed="true"><b>Công việc</b><small>Email, lịch, phân tích file</small></button>
  <button class="goal" data-goal="research" aria-pressed="false"><b>Nghiên cứu</b><small>Tìm nguồn, tóm tắt có trích dẫn</small></button>
  <button class="goal" data-goal="study" aria-pressed="false"><b>Học tập</b><small>Gia sư, bài tập</small></button>
  <button class="goal" data-goal="money" aria-pressed="false"><b>Tài chính</b><small>Giá vàng, tỷ giá, ngân sách</small></button>
 </div>
 <button class="btn primary" id="startBtn">Bắt đầu</button>
</section>
<p class="msg" id="msg" role="status" aria-live="polite"></p>
<footer id="plan"></footer>
</main><script src="/app/hosted.js"></script></body></html>
